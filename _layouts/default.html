

<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title }}</title>

    <!-- Website fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600&display=swap"
      rel="stylesheet"
    >

    <!-- Existing theme styles -->
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <!-- Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    >
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons/css/academicons.min.css"
    >

    <!-- New design: keep this stylesheet last -->
    <link rel="stylesheet" href="{{ '/assets/css/elegant.css' | relative_url }}">
  </head>

  <body class="academic-site">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <div class="wrapper">
      <header class="profile">
        <img
          class="profile-photo"
          src="{{ '/assets/img/rabi_headshot.jpg' | relative_url }}"
          alt="Portrait of {{ site.title | escape }}"
          width="240"
          height="240"
        >

        <h1 class="site-name">
          <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
        </h1>

        <p class="site-description">{{ site.description }}</p>

        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about' | relative_url }}">About me</a>
          <a href="{{ '/research' | relative_url }}">Research</a>
          <a href="{{ '/publications' | relative_url }}">Publications</a>
        </nav>
      </header>

      <main id="main-content" class="main-content">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="social-links" aria-label="Academic and social profiles">
          <a
            href="https://orcid.org/0009-0007-0682-0463"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="ORCID"
            title="ORCID"
          >
            <i class="ai ai-orcid" aria-hidden="true"></i>
          </a>

          <a
            href="https://scholar.google.com/citations?user=u8VgoyIAAAAJ&hl=en"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Google Scholar"
            title="Google Scholar"
          >
            <i class="ai ai-google-scholar" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.researchgate.net/profile/Rabisankar-Samanta"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="ResearchGate"
            title="ResearchGate"
          >
            <i class="fab fa-researchgate" aria-hidden="true"></i>
          </a>

          <a
            href="https://www.linkedin.com/in/rabisankar-samanta-82243b12a/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
            title="LinkedIn"
          >
            <i class="fab fa-linkedin" aria-hidden="true"></i>
          </a>

          <a
            href="https://github.com/rabioptics"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="GitHub"
            title="GitHub"
          >
            <i class="fab fa-github" aria-hidden="true"></i>
          </a>
        </div>

        <p>&copy; {{ site.time | date: "%Y" }} {{ site.title }}.</p>
      </footer>
    </div>
  </body>
</html>
